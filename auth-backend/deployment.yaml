apiVersion: apps/v1
kind: Deployment
metadata:
  name: first-deployment
  labels:
    app: example
spec:
  replicas: 2
  selector:
    matchLabels:
      app: example
  template:
    metadata:
      labels:
        app: example
    spec:
      containers:
        - name: example-container
          image: elifhazal/backend-api:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef: 
                name: secrets-env
