services:
  db:
    image: postgres:14-alpine
    ports:
      - '5436:5432'
    container_name: 'test-db4'
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - API_ADMIN_EMAIL
      - API_ADMIN_PASSWORD
      - API_SEED_DB
    volumes:
      - db-volume:/var/lib/postgresql/data

  api:
    image: elifbuber/backend-api:latest
    container_name: backend2
    build:
      context: .
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - '3000:3000'

volumes:
  db-volume: {}
